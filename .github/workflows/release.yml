name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            rpm: true
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
            rpm: false
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
            rpm: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
            rpm: false

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: matrix.archive == 'tar.gz'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../posterm-${{ matrix.target }}.tar.gz posterm
          cd ../../..

      - name: Package (Windows)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../posterm-${{ matrix.target }}.zip posterm.exe
          cd ../../..

      - name: Generate RPM
        if: matrix.rpm
        run: |
          cargo install cargo-generate-rpm
          cp target/${{ matrix.target }}/release/posterm target/release/posterm
          cargo generate-rpm
          cp target/generate-rpm/posterm-*.rpm posterm-x86_64.rpm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: posterm-${{ matrix.target }}
          path: posterm-${{ matrix.target }}.${{ matrix.archive }}

      - name: Upload RPM artifact
        if: matrix.rpm
        uses: actions/upload-artifact@v4
        with:
          name: posterm-rpm
          path: posterm-x86_64.rpm

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*
